<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bakery</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>

<body>

<div class="container mt-4">
  <h1 class="text-center">Online Bakery Feedback Form</h1>
<form>

    <div class="form-group">
        <label for="Name">Name</label>
        <input type="text" class="form-control" id="Name" placeholder="Enter Your Name" name="name">
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>

    <div class="form-group">
        <label for="Message">Feedback Message:</label>
        <textarea class="form-control" rows="3" id="Message" name="message"></textarea>
    </div>

    <div class="form-group">
        <div>Preferred Contact Method:</div>

        <div class="form-check">
            <label class="form-check-label">
                <input type="radio" class="form-check-input" name="optradio">Email
            </label>
        </div>

        <div class="form-check">
            <label class="form-check-label">
                <input type="radio" class="form-check-input" name="optradio">Phone
            </label>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Satisfaction Level (1–10)</label>
        <input type="range" class="form-control-range" name="range" min="1" max="10">
    </div>

    <div class="form-group">
        <label for="sel1">Select one:</label>
        <select class="form-control" id="sel1" name="category">
            <option>Cakes</option>
            <option>Cookies</option>
            <option>Pastries</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>

</form>
</div>

</body>
</html>
