<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Website Feedback</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>

<div class="container mt-5">
    <h2 class="text-center mb-4">Website Feedback Form</h2>

    <form>
<div class="form-group">
        <label for="Name">Name</label>
        <input type="text" class="form-control" id="Name" placeholder="Enter Your Name" name="name">
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>

    <div class="form-group">
        <label for="Message">Feedback Message:</label>
        <textarea class="form-control" rows="3" id="Message" name="message"></textarea>
    </div>
    <div class="form-group">
            <label for="source">How did you find our site?</label>
            <select class="form-control" id="source" required>
                <option value="">Select an option</option>
                <option>Search Engine</option>
                <option>Social Media</option>
                <option>Friend or Family</option>
                <option>Advertisement</option>
                <option>Other</option>
            </select>
        </div>
         <div class="form-group">
            <label>Satisfaction Level</label>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="satisfaction" value="1">
                <label class="form-check-label">1 - Very Dissatisfied</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="satisfaction" value="2">
                <label class="form-check-label">2 - Somewhat Dissatisfied</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="satisfaction" value="3">
                <label class="form-check-label">3 - Neutral</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="satisfaction" value="4">
                <label class="form-check-label">4 - Somewhat Satisfied</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="satisfaction" value="5">
                <label class="form-check-label">5 - Very Satisfied</label>
            </div>
        </div>
           <button type="submit" class="btn btn-primary">Submit</button>
</form>
<body>
    
</body>
</html>
