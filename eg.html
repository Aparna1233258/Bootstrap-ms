<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="text-center mb-4">Bakery Feedback Form</h3>

          <form>

            <!-- Name -->
            <div class="mb-3">
              <label class="form-label">Customer Name</label>
              <input type="text" class="form-control" placeholder="Enter your name" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <!-- Order Type -->
            <div class="mb-3">
              <label class="form-label">Type of Order</label>
              <select class="form-select" required>
                <option value="">Select order type</option>
                <option>Cake</option>
                <option>Cookies</option>
                <option>Pastries</option>
              </select>
            </div>

            <!-- Satisfaction Level -->
            <div class="mb-3">
              <label class="form-label">Satisfaction Level (1–10)</label>
              <input type="range" class="form-range" min="1" max="10">
            </div>

            <!-- Preferred Contact Method -->
            <div class="mb-3">
              <label class="form-label d-block">Preferred Contact Method</label>

              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="contact" value="email" required>
                <label class="form-check-label">Email</label>
              </div>

              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="contact" value="phone">
                <label class="form-check-label">Phone</label>
              </div>
            </div>

            <!-- Feedback Message -->
            <div class="mb-4">
              <label class="form-label">Your Feedback</label>
              <textarea class="form-control" rows="4" placeholder="Share your experience..." required></textarea>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                Submit Feedback
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>

    
</body>
</html>
